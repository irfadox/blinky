<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blinky</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 16px auto; padding: 0 12px; color: #111; line-height: 1.4; }
  h1 { font-size: 1.1rem; margin: 0 0 10px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; font-size: 0.9rem; }
  canvas { display: block; width: 100%; height: auto; border: 1px solid #888; background: #000; margin-bottom: 10px; }
  #specCanvas { background: #fafafa; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-bottom: 10px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
  th { background: #f2f2f2; width: 34%; }
  .muted { color: #555; font-size: 0.82rem; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>Blinky: Compare the night sky over time (NASA SPHEREx, ESA Gaia, CSA NEOSSat)</h1>

<div class="controls">
  <label>Target:
    <select id="targetSel">
      <optgroup label="NASA SPHEREx (Near-IR 0.75–5.0 um)">
        <option value="wise0855">WISE 0855 (Cold Brown Dwarf / Dropout)</option>
        <option value="barnards">Barnard's Star (High Proper Motion)</option>
        <option value="eps_indi_b">Epsilon Indi B (Binary Brown Dwarf)</option>
        <option value="rw_aurigae">RW Aurigae (Dimming Variable)</option>
        <option value="r_draconis">R Draconis (Mira Variable)</option>
      </optgroup>
      <optgroup label="CSA NEOSSat (Optical Microsatellite)">
        <option value="neossat_mover">NEOSSat Solar System Mover</option>
        <option value="neossat_field">NEOSSat Variable and LEO Streak Field</option>
      </optgroup>
    </select>
  </label>

  <span>View:
    <label><input type="radio" name="mode" value="A"> Epoch A</label>
    <label><input type="radio" name="mode" value="B"> Epoch B</label>
    <label><input type="radio" name="mode" value="blink" checked> Blink</label>
    <label><input type="radio" name="mode" value="diff"> Diff (B&minus;A)</label>
  </span>

  <label id="bandWrap">Detector:
    <select id="bandSel">
      <option value="coadd">All 6 Arrays (Coadded)</option>
      <option value="D1">Array 1 (0.75–1.11 &mu;m)</option>
      <option value="D2">Array 2 (1.11–1.64 &mu;m)</option>
      <option value="D3">Array 3 (1.64–2.42 &mu;m)</option>
      <option value="D4">Array 4 (2.42–3.82 &mu;m)</option>
      <option value="D5">Array 5 (3.82–4.42 &mu;m)</option>
      <option value="D6">Array 6 (4.42–5.00 &mu;m)</option>
    </select>
  </label>

  <label><input type="checkbox" id="gaiaToggle"> Gaia DR3 overlay</label>
</div>

<canvas id="skyCanvas" width="256" height="256"></canvas>

<table>
  <tr><th>Object</th><td id="infoId">&mdash;</td></tr>
  <tr><th>Catalog match</th><td id="infoStatus">&mdash;</td></tr>
  <tr><th>Flux &Delta; / Flags</th><td id="infoDelta">&mdash;</td></tr>
  <tr><th>Archives</th><td id="infoLinks">&mdash;</td></tr>
</table>

<div id="specSection">
  <div class="muted">Spectrum (0.75–5.00 &mu;m): Epoch A (blue) vs. Epoch B (red)</div>
  <canvas id="specCanvas" width="600" height="175"></canvas>
</div>
<div class="muted" id="dataSourceNote">Loading...</div>

<script>
const PRESETS = {
  wise0855:      { mission: "SPHEREx", name: "WISE 0855",                        ra: 133.79513, dec: -7.24515,  epA: "2025-05", epB: "2025-11", status: "No Gaia DR3 match (optical dropout, 4.1\" proper motion)", delta: "-0.2% (Flags: 0x00)",  dx: 11, dy: -6,  fA: 1.0, fB: 1.0,  ir: true,  temp: 260,  cadc: 2 },
  barnards:      { mission: "SPHEREx", name: "Barnard's Star",                   ra: 269.45208, dec: 4.69336,   epA: "2025-04", epB: "2025-10", status: "Gaia DR3 match (5.1\" proper motion)",                     delta: "+0.4% (Flags: 0x00)",  dx: -4, dy: 13,  fA: 1.4, fB: 1.4,  ir: true,  temp: 3100, cadc: 5 },
  eps_indi_b:    { mission: "SPHEREx", name: "Epsilon Indi B",                   ra: 331.07625, dec: -56.78250, epA: "2025-05", epB: "2025-11", status: "Gaia DR3 match (binary brown dwarf)",                      delta: "-1.1% (Flags: 0x00)",  dx: 5,  dy: 4,   fA: 1.1, fB: 1.09, ir: true,  temp: 1100, cadc: 1 },
  rw_aurigae:    { mission: "SPHEREx", name: "RW Aurigae",                       ra: 76.95654,  dec: 30.40144,  epA: "2025-03", epB: "2025-09", status: "Gaia DR3 match (variable star)",                           delta: "-45.2% (Flags: 0x02)", dx: 0,  dy: 0,   fA: 1.5, fB: 0.82, ir: true,  temp: 4200, cadc: 4 },
  r_draconis:    { mission: "SPHEREx", name: "R Draconis",                       ra: 248.16500, dec: 66.75528,  epA: "2025-04", epB: "2025-10", status: "Gaia DR3 match (Mira variable)",                           delta: "+68.4% (Flags: 0x00)", dx: 0,  dy: 0,   fA: 0.9, fB: 1.52, ir: true,  temp: 2800, cadc: 3 },
  neossat_mover: { mission: "NEOSSat", name: "NEOSSat Solar System Mover",       ra: 185.4200,  dec: -2.1500,   epA: "T+00m",   epB: "T+18m",   status: "No Gaia DR3 match (Solar System mover)",                   delta: "+2.1% (Flags: 0x00)",  dx: 18, dy: -11, fA: 1.1, fB: 1.12, ir: false, temp: 5500, cadc: 14 },
  neossat_field: { mission: "NEOSSat", name: "NEOSSat Variable and Streak Field", ra: 210.8000, dec: 14.3000,   epA: "T+00m",   epB: "T+24m",   status: "Gaia DR3 match (variable star and satellite streak)",      delta: "+34.0% (Flags: 0x00)", dx: 0,  dy: 0,   fA: 0.8, fB: 1.08, ir: false, temp: 5500, cadc: 9, streak: true }
};

let currentData = null;
let blinkFrame = 0;
const offCanvas = document.createElement("canvas");
const offCtx = offCanvas.getContext("2d");

function makeFallbackData(id) {
  const p = PRESETS[id];
  const N = 128;
  let seed = id.split("").reduce((a, c) => a + c.charCodeAt(0), 23);
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stars = Array.from({ length: 22 }, () => [12 + rand() * 104, 12 + rand() * 104, 0.3 + rand() * 0.7]);
  const gaia_stars = stars.filter((_, i) => i % 4 !== 0).map(s => ({
    x: +s[0].toFixed(1), y: +s[1].toFixed(1),
    pm_dx: +((rand() - 0.5) * 3).toFixed(2), pm_dy: +((rand() - 0.5) * 3).toFixed(2)
  }));
  if (id !== "wise0855" && id !== "neossat_mover") {
    gaia_stars.push({ x: +(64 - p.dx * 0.5).toFixed(1), y: +(64 - p.dy * 0.5).toFixed(1), pm_dx: p.dx, pm_dy: p.dy });
  }

  const buildGrid = (ox, oy, amp, noise, addStreak) => {
    const g = Array.from({ length: N }, () => new Float32Array(N));
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        let v = 0.03 + (rand() - 0.5) * noise;
        for (const [sx, sy, sb] of stars) {
          const d2 = (x - sx) ** 2 + (y - sy) ** 2;
          if (d2 < 36) v += sb * Math.exp(-d2 / 3.2);
        }
        const td2 = (x - (64 + ox)) ** 2 + (y - (64 + oy)) ** 2;
        if (td2 < 64) v += amp * Math.exp(-td2 / 3.6);
        if (addStreak && Math.abs((y - 20) - 0.65 * (x - 10)) < 1.1 && x > 15 && x < 115) v += 0.65;
        g[y][x] = Math.max(0, v);
      }
    }
    return g;
  };

  const oxA = -p.dx * 0.5, oyA = -p.dy * 0.5;
  const oxB =  p.dx * 0.5, oyB =  p.dy * 0.5;

  let arrays = null, spectrum = null;
  if (p.ir) {
    arrays = {};
    for (let d = 1; d <= 6; d++) {
      const w = p.temp < 500 ? (d >= 5 ? 1.5 : 0.15) : (d <= 3 ? 1.2 : 0.6);
      arrays["D" + d] = { A: buildGrid(oxA, oyA, p.fA * w, 0.035, false), B: buildGrid(oxB, oyB, p.fB * w, 0.035, false) };
    }
    const wave_um = Array.from({ length: 102 }, (_, i) => +(0.75 + (4.25 * i) / 101).toFixed(3));
    const fluxA = wave_um.map(w => {
      let base = p.temp < 500 ? Math.exp((w - 3.6) * 1.15) * 0.6 : (2.2 / (w + 0.4)) * p.fA;
      if (id === "eps_indi_b" && (Math.abs(w - 1.65) < 0.15 || Math.abs(w - 3.3) < 0.2)) base *= 0.45;
      if (id === "r_draconis" && Math.abs(w - 2.7) < 0.2) base *= 0.65;
      return +Math.max(0.03, base).toFixed(3);
    });
    const fluxB = fluxA.map((v, i) => +(v * (p.fB / p.fA) * (id === "rw_aurigae" && wave_um[i] > 3.2 ? 1.35 : 1.0)).toFixed(3));
    spectrum = { wave_um, fluxA, fluxB };
  }

  return {
    id, mission: p.mission, name: p.name, ra: p.ra, dec: p.dec, size: N,
    epochA_date: p.epA, epochB_date: p.epB,
    status: p.status, delta_str: p.delta,
    coaddA: buildGrid(oxA, oyA, p.fA, 0.012, false),
    coaddB: buildGrid(oxB, oyB, p.fB, 0.012, !!p.streak),
    arrays, spectrum, gaia_stars, cadc_optical_count: p.cadc,
    source: `Synthetic Fallback (${p.mission}, ${N}x${N} px)`,
    wiseview_url: `http://byw.tools/wiseview#ra=${p.ra}&dec=${p.dec}&size=176&band=2&speed=500&linear=1&zoom=9`,
    cadc_url: `https://www.cadc-ccda.hia-iha.nrc-cnrc.gc.ca/en/search/?Plane.position.bounds=${p.ra}%20${p.dec};0.1&Observation.collection=NEOSSAT`
  };
}

function syncHash() {
  const id = document.getElementById("targetSel").value;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  history.replaceState(null, "", `#target=${id}&mode=${mode}`);
}

function ensureSpectrum102(spec) {
  if (!spec || !Array.isArray(spec.wave_um) || spec.wave_um.length === 0 || spec.wave_um.length >= 102) return spec;
  const pts = spec.wave_um
    .map((w, i) => ({ w, a: spec.fluxA[i] ?? 0, b: spec.fluxB[i] ?? 0 }))
    .sort((p, q) => p.w - q.w);
  const interp = (key, x) => {
    if (x <= pts[0].w) return pts[0][key];
    if (x >= pts[pts.length - 1].w) return pts[pts.length - 1][key];
    let hi = pts.findIndex(p => p.w >= x);
    const p0 = pts[hi - 1], p1 = pts[hi];
    const t = p1.w === p0.w ? 0 : (x - p0.w) / (p1.w - p0.w);
    return +(p0[key] + t * (p1[key] - p0[key])).toFixed(4);
  };
  const wave_um = Array.from({ length: 102 }, (_, i) => +(0.75 + (4.25 * i) / 101).toFixed(3));
  return {
    wave_um,
    fluxA: wave_um.map(w => interp("a", w)),
    fluxB: wave_um.map(w => interp("b", w))
  };
}

async function loadTargetData(id) {
  if (window.BLINKY_DATA && window.BLINKY_DATA[id]) return window.BLINKY_DATA[id];
  if (window.location.protocol !== "file:") {
    try {
      const res = await fetch(`data/${id}.json`);
      if (res.ok) return await res.json();
    } catch {}
  }
  return await new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = `data/${id}.js`;
    s.onload = () => {
      if (window.BLINKY_DATA && window.BLINKY_DATA[id]) resolve(window.BLINKY_DATA[id]);
      else reject(new Error("Missing BLINKY_DATA entry"));
    };
    s.onerror = () => {
      s.remove();
      reject(new Error("No JS data"));
    };
    document.head.appendChild(s);
  });
}

async function loadTarget(id) {
  try {
    const json = await loadTargetData(id);
    if (document.getElementById("targetSel").value !== id) return;
    const p = PRESETS[id];
    currentData = {
      ...json,
      spectrum: ensureSpectrum102(json.spectrum),
      mission: p ? p.mission : json.mission,
      name: p ? p.name : json.name,
      delta_str: `${json.delta_str} (Flags: ${json.flag_str})`,
      source: `Live FITS Cutout (${json.mission}, ${json.size}x${json.size} px)`
    };
  } catch {
    if (document.getElementById("targetSel").value !== id) return;
    currentData = makeFallbackData(id);
  }

  const isIR = !!currentData.spectrum && currentData.spectrum.wave_um && currentData.spectrum.wave_um.length > 0;
  document.getElementById("bandWrap").classList.toggle("hidden", !currentData.arrays);
  document.getElementById("specSection").classList.toggle("hidden", !isIR);
  if (!currentData.arrays) document.getElementById("bandSel").value = "coadd";

  document.getElementById("infoId").textContent = `${currentData.name} (${currentData.mission})`;
  document.getElementById("infoStatus").textContent = currentData.status;
  document.getElementById("infoDelta").textContent = currentData.delta_str;
  document.getElementById("infoLinks").innerHTML =
    `<a href="${currentData.wiseview_url}" target="_blank" rel="noopener">WiseView</a> / ` +
    `<a href="${currentData.cadc_url}" target="_blank" rel="noopener">CADC (${currentData.cadc_optical_count} frames)</a>`;
  document.getElementById("dataSourceNote").textContent = currentData.source;

  syncHash();
  if (isIR) drawSpectrum();
  renderSky();
}

function renderSky() {
  if (!currentData) return;
  const canvas = document.getElementById("skyCanvas");
  const ctx = canvas.getContext("2d");
  const N = currentData.size;
  const band = currentData.arrays ? document.getElementById("bandSel").value : "coadd";
  const mode = document.querySelector('input[name="mode"]:checked').value;

  const gridA = (band === "coadd" || !currentData.arrays) ? currentData.coaddA : currentData.arrays[band].A;
  const gridB = (band === "coadd" || !currentData.arrays) ? currentData.coaddB : currentData.arrays[band].B;

  if (offCanvas.width !== N || offCanvas.height !== N) {
    offCanvas.width = N;
    offCanvas.height = N;
  }
  const img = offCtx.createImageData(N, N);

  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const idx = (y * N + x) * 4;
      const a = gridA[y][x], b = gridB[y][x];
      if (mode === "diff") {
        const d = Math.max(-1, Math.min(1, (b - a) * 1.4));
        img.data[idx]     = d > 0 ? Math.round(d * 255) : 0;
        img.data[idx + 1] = Math.round(Math.abs(d) * 60);
        img.data[idx + 2] = d < 0 ? Math.round(-d * 255) : 0;
      } else {
        const val = (mode === "A" || (mode === "blink" && blinkFrame === 0)) ? a : b;
        const px = Math.min(255, Math.round((Math.asinh(val * 4) / Math.asinh(6)) * 255));
        img.data[idx] = img.data[idx + 1] = img.data[idx + 2] = px;
      }
      img.data[idx + 3] = 255;
    }
  }
  offCtx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(offCanvas, 0, 0, canvas.width, canvas.height);

  const scale = canvas.width / N;
  const cx = (N / 2) * scale, cy = (N / 2) * scale;
  ctx.strokeStyle = "rgba(255, 80, 80, 0.85)";
  ctx.lineWidth = 1;
  ctx.strokeRect(cx - 10, cy - 10, 20, 20);

  if (document.getElementById("gaiaToggle").checked) {
    ctx.strokeStyle = "#39ff14";
    ctx.lineWidth = 1.2;
    for (const s of currentData.gaia_stars) {
      const sx = s.x * scale, sy = s.y * scale;
      ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI * 2); ctx.stroke();
      if (Math.hypot(s.pm_dx, s.pm_dy) > 0.3) {
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + s.pm_dx * scale, sy + s.pm_dy * scale);
        ctx.stroke();
      }
    }
  }

  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(6, 6, 175, 18);
  ctx.fillStyle = "#fff";
  ctx.font = "11px monospace";
  const epLabel = mode === "diff"
    ? `DIFF (${currentData.epochB_date} - ${currentData.epochA_date})`
    : (mode === "A" || (mode === "blink" && blinkFrame === 0))
      ? `EPOCH A (${currentData.epochA_date})`
      : `EPOCH B (${currentData.epochB_date})`;
  ctx.fillText(epLabel, 10, 18);
}

function drawSpectrum() {
  const c = document.getElementById("specCanvas");
  const ctx = c.getContext("2d");
  const { wave_um, fluxA, fluxB } = currentData.spectrum;
  ctx.clearRect(0, 0, c.width, c.height);
  if (!wave_um.length) return;

  const pad = { l: 36, r: 12, t: 12, b: 22 };
  const w = c.width - pad.l - pad.r, h = c.height - pad.t - pad.b;
  const maxF = Math.max(...fluxA, ...fluxB, 0.1) * 1.1;

  ctx.strokeStyle = "#ccc";
  ctx.strokeRect(pad.l, pad.t, w, h);
  ctx.fillStyle = "#444";
  ctx.font = "11px monospace";
  ctx.fillText("0.75 um", pad.l, c.height - 6);
  ctx.fillText("2.8 um", pad.l + w * 0.45, c.height - 6);
  ctx.fillText("5.00 um", pad.l + w - 44, c.height - 6);

  const plotLine = (arr, color, dashed) => {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    if (dashed) ctx.setLineDash([5, 4]);
    ctx.beginPath();
    arr.forEach((val, i) => {
      const x = pad.l + ((wave_um[i] - 0.75) / 4.25) * w;
      const y = pad.t + h - (val / maxF) * h;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.restore();
  };

  plotLine(fluxB, "red", false);
  plotLine(fluxA, "blue", true);
}

document.getElementById("targetSel").addEventListener("change", e => loadTarget(e.target.value));
document.getElementById("bandSel").addEventListener("change", renderSky);
document.getElementById("gaiaToggle").addEventListener("change", renderSky);
document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", () => { syncHash(); renderSky(); }));

setInterval(() => {
  if (document.querySelector('input[name="mode"]:checked').value === "blink") {
    blinkFrame = 1 - blinkFrame;
    renderSky();
  }
}, 500);

const params = new URLSearchParams(window.location.hash.slice(1));
const initTarget = PRESETS[params.get("target")] ? params.get("target") : "wise0855";
const initMode = ["A", "B", "blink", "diff"].includes(params.get("mode")) ? params.get("mode") : "blink";
document.getElementById("targetSel").value = initTarget;
document.querySelector(`input[name="mode"][value="${initMode}"]`).checked = true;
loadTarget(initTarget);
</script>
</body>
</html>
